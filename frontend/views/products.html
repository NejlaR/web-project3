<section>
  <h2>Our Products</h2>

  <p class="text-muted mb-4">
    Discover our most popular shoes this season.
  </p>

  <!-- M1: planirano mjesto za buducu integraciju vanjskog API-ja -->
  <div class="card p-3 mb-4">
    <h5>Currency Converter</h5>

    <p class="small text-muted">
      Planned external API feature: display product prices
      in a selected currency.
    </p>

    <label for="currency-preview" class="form-label">
      Display currency
    </label>

    <select
      id="currency-preview"
      class="form-select"
      disabled
      aria-describedby="currency-note"
    >
      <option selected>USD — US Dollar</option>
      <option>EUR — Euro</option>
    </select>


  </div>

  <div class="row gy-4">
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <img
          src="assets/images/Nike Women's Air Force 1 '07 LX.jpg"
          class="card-img-top"
          alt="Sneaker"
        >

        <div class="card-body">
          <h5>Aurora Classic</h5>
          <p class="text-muted">$49.99</p>

          <a class="btn btn-primary" href="#orders">
            Add to Cart
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <img
          src="assets/images/Shoe Product Photography for Linea Paolo FW23 Campaign — Tracy Nichole.jpg"
          class="card-img-top"
          alt="Boot"
        >

        <div class="card-body">
          <h5>Leather Pro Boot</h5>
          <p class="text-muted">$99.99</p>

          <a class="btn btn-primary" href="#orders">
            Add to Cart
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <img
          src="assets/images/-42.jpg"
          class="card-img-top"
          alt="Running Shoe"
        >

        <div class="card-body">
          <h5>Running Elite</h5>
          <p class="text-muted">$79.99</p>

          <a class="btn btn-primary" href="#orders">
            Add to Cart
          </a>
        </div>
      </div>
    </div>
  </div>

</section>
