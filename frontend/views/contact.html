<section>
  <h2>Contact Us</h2>

  <p class="text-muted mb-4">
    We’d love to hear from you!
    Reach out for product inquiries or support.
  </p>

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card p-4 form-card shadow-sm">
        <form id="contactForm">
          <div class="mb-3">
            <label for="contact-name" class="form-label">
              Full Name
            </label>

            <input
              id="contact-name"
              class="form-control"
              type="text"
              name="name"
              required
            >
          </div>

          <div class="mb-3">
            <label for="contact-email" class="form-label">
              Email
            </label>

            <input
              id="contact-email"
              class="form-control"
              type="email"
              name="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="contact-message" class="form-label">
              Message
            </label>

            <textarea
              id="contact-message"
              class="form-control"
              name="message"
              rows="3"
              required
            ></textarea>
          </div>

          <button class="btn btn-primary w-100" type="submit">
            Send Message
          </button>
        </form>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-4 h-100 shadow-sm">
        <h5>Aurora Shoes Store</h5>

        <p class="small text-muted">
          123 Fashion Street, Sarajevo
        </p>

        <p class="small text-muted mb-1">
          Phone: +387 61 555 999
        </p>

        <p class="small text-muted mb-1">
          Email: support@aurora.shop
        </p>
      </div>
    </div>
  </div>
</section>
